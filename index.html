<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月例報告会議 2026年5月</title>
<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Yu Gothic','Meiryo',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{background:linear-gradient(135deg,#1a3a5c,#2c5282);color:#fff;padding:22px 40px 18px;display:flex;align-items:flex-end;justify-content:space-between}
header h1{font-size:22px;font-weight:700;letter-spacing:.02em}
header .sub{font-size:13px;opacity:.8;margin-top:4px}
header .badge{background:#e85d04;color:#fff;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}

/* ── タブナビゲーション ── */
.tabs-nav{background:#fff;border-bottom:2px solid var(--border);padding:0 40px;display:flex;gap:0;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.tab-btn{padding:14px 24px;font-size:13px;font-weight:600;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .2s,border-color .2s;white-space:nowrap}
.tab-btn:hover{color:var(--primary)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ── タブパネル ── */
.tab-panel{display:none}
.tab-panel.active{display:block}

main{max-width:1100px;margin:0 auto;padding:28px 20px 60px}
section{margin-bottom:36px}
.st{font-size:15px;font-weight:700;color:var(--primary);border-left:4px solid var(--accent);padding-left:10px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kpi{background:var(--card);border-radius:12px;padding:18px 20px;box-shadow:0 1px 4px rgba(0,0,0,.08);border:1px solid var(--border);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent)}
.kpi.kpi-green::before{background:var(--positive)}
.kpi.kpi-red::before{background:var(--negative)}
.kpi.kpi-yellow::before{background:#f59e0b}
.kl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.kv{font-size:26px;font-weight:800;color:var(--primary);line-height:1;margin-bottom:4px}
.ks{font-size:11px;color:var(--muted)}
.ks.down{color:var(--negative)}
.ky{display:inline-block;margin-top:8px;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:700;background:#dcfce7;color:#2d9e5f}
.ky.down{background:#fef2f2;color:#991b1b}
details>summary::-webkit-details-marker{display:none}
details[open]>summary span:first-child{transform:rotate(90deg);display:inline-block}
.card{background:var(--card);border-radius:12px;padding:20px 24px;box-shadow:0 1px 4px rgba(0,0,0,.08);border:1px solid var(--border);margin-bottom:14px}
.card h3,.card-title{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.gw-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.hb{background:linear-gradient(135deg,#fef3c7,#fde68a);border-radius:10px;padding:16px 20px;border:1px solid #fcd34d}
.hb .lb{font-size:11px;color:#92400e;font-weight:700;margin-bottom:4px}
.hb .vl{font-size:22px;font-weight:800;color:#92400e}
.hb .sb{font-size:11px;color:#a16207;margin-top:2px}
.ib{background:linear-gradient(135deg,#eff6ff,#dbeafe);border-radius:10px;padding:16px 20px;border:1px solid #93c5fd}
.ib .lb{font-size:11px;color:#1e40af;font-weight:700;margin-bottom:4px}
.ib .vl{font-size:22px;font-weight:800;color:#1e40af}
.ib .sb{font-size:11px;color:#3b82f6;margin-top:2px}
.notice{border-radius:10px;padding:12px 16px;margin-top:12px;font-size:13px;line-height:1.65}
.ny{background:#fffbeb;border:1px solid #fcd34d;color:#92400e}
.nb{background:#eff6ff;border:1px solid #93c5fd;color:#1e40af}
.ng{background:#f0fdf4;border:1px solid #86efac;color:#166534}
.np{background:#fdf4ff;border:1px solid #e9d5ff;color:#6b21a8}
.nr{background:#fef2f2;border:1px solid #fca5a5;color:#991b1b}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:#374151}
.ld{width:10px;height:10px;border-radius:50%;flex-shrink:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f1f5f9;color:var(--muted);font-weight:700;padding:8px 12px;text-align:left;font-size:11px;text-transform:uppercase}
td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fafc}
.rank{font-size:12px;font-weight:700;color:var(--muted)}
.r1{color:#d97706}.r2{color:#9ca3af}.r3{color:#cd7c3d}
.pct-bar{display:flex;align-items:center;gap:8px}
.bar{height:6px;border-radius:3px;background:linear-gradient(90deg,#e85d04,#f48c06)}
.issue-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ic{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);border:1px solid var(--border);border-top:4px solid #d62828}
.ac{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);border:1px solid var(--border);border-top:4px solid #2d9e5f}
.ct{font-size:14px;font-weight:700;margin-bottom:10px}
.ic .ct{color:#d62828}.ac .ct{color:#2d9e5f}
.cb{font-size:13px;color:var(--muted);line-height:1.75}
.cb strong{color:var(--text)}
.model-box{background:#1a3a5c;color:#fff;border-radius:10px;padding:18px;margin-top:12px}
.model-box h4{font-size:13px;font-weight:700;margin-bottom:12px;color:#fbbf24}
.model-flow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.flow-card{background:rgba(255,255,255,.08);border-radius:8px;padding:14px;border:1px solid rgba(255,255,255,.15)}
.flow-card .fct{font-size:11px;font-weight:700;color:#fbbf24;margin-bottom:8px}
.flow-step{display:flex;align-items:flex-start;gap:7px;margin-bottom:7px;font-size:12px;line-height:1.5}
.sn{background:#e85d04;color:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px}

/* ── 棒グラフ ── */
.bar-chart{display:flex;flex-direction:column;gap:10px}
.bar-row{display:flex;align-items:center;gap:10px;font-size:12px}
.bar-label{min-width:80px;color:var(--muted)}
.bar-track{flex:1;height:22px;background:#f1f5f9;border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.bar-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;font-size:11px;font-weight:700;color:#fff;min-width:30px}
.bar-fill.red{background:linear-gradient(90deg,#d62828,#ef4444)}
.bar-fill.yellow{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.bar-fill.blue{background:linear-gradient(90deg,#1a3a5c,#2c5282)}
.bar-num{min-width:50px;text-align:right;font-size:12px;font-weight:700;color:var(--primary)}

/* タグ */
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px}
.tag-green{background:#dcfce7;color:#166534}
.tag-red{background:#fef2f2;color:#991b1b}
.tag-yellow{background:#fffbeb;color:#92400e}
.tag-blue{background:#eff6ff;color:#1e40af}

@media(max-width:700px){.kpi-grid,.two,.three,.issue-grid,.model-flow{grid-template-columns:1fr}.tabs-nav{padding:0 16px;overflow-x:auto}.tab-btn{padding:12px 14px}}
footer{text-align:center;padding:20px;color:var(--muted);font-size:11px}
</style>
</head>

<section>
<div class="st">&#128269; 課題と対策</div>
<div class="issue-grid">

<div class="ic">
<div class="ct">&#9888; 課題1　PAが繁忙期に純減 ― 入社65名 &lt; 退社79名、在籍 2,493名 &#8594; 2,456名</div>
<div class="cb">離職側は改善している（年間着地予測 54.3% &#8594; 53.4%、前期54.6%を下回る見込み）一方で、<strong>8月のPA入社が150名&#8594;65名（43.3%）まで落ち、退社79名を下回ってネット-14名</strong>。7月のネット+56名から反転した。PA採用費も&#165;3,835千&#8594;&#165;2,563千（66.8%）と縮小しており、出稿の絞り込みと在籍減が連動している。繁忙期に人員が減った状態で9月以降のシフトを組むことになる。</div>
</div>
<div class="ac">
<div class="ct">&#10003; 対策1　出稿を止めるのではなく、欠員が出ている組織に寄せて配分し直す</div>
<div class="cb">&#8226; 9月第1週に<strong>欠員が発生している店舗のリストを確定</strong>し、9&#12316;10月のPA求人出稿を全店一律ではなく欠員店舗に集中配分する。<br>&#8226; 8月退社79名の在籍期間を集計し、<strong>在籍3ヶ月未満の比率が高い組織では入社30日・60日フォロー面談を必須運用</strong>に切り替える。<br>&#8226; 管理指標を「入社数」から<strong>「入社&#8722;退社のネット増減」</strong>に変更し、月次報告で常時併記する。9月にネットがプラスへ戻るかを次回の判断軸とする。</div>
</div>

<div class="ic">
<div class="ct">&#9888; 課題2　正社員採用で承諾5名 &lt; 辞退12名 ― 歩留まりが2ヶ月連続で悪化</div>
<div class="cb">内定は31名（前月+1名）と母数は維持しているが、<strong>承諾は8名&#8594;5名に減り、辞退は9名&#8594;12名に増えて承諾を上回った</strong>。前回（7月）報告でも「辞退5名&#8594;9名」を課題に挙げており、対策後も改善していない。8月の入社は6名（実質11名）に対し退社8名で、実質ベースの純増は+3名にとどまる。9月の入社をピークに採用活動を抑える計画のため、<strong>母数を増やす余地は小さく、歩留まりの改善が唯一の打ち手になる</strong>。</div>
</div>
<div class="ac">
<div class="ct">&#10003; 対策2　内定〜入社のリードタイムを詰め、承諾5名を確実に入社させる</div>
<div class="cb">&#8226; 内定31名のうち<strong>入社予定日までの期間が長い候補者を優先して、9月中に現場見学とメンター面談を組む</strong>。<br>&#8226; 辞退12名は「条件（給与・勤務地）／他社競合／入社時期」の3類型で記録し、<strong>次回以降は初回面談の段階で該当条件を先に提示する運用</strong>に変える。<br>&#8226; 承諾5名には入社日まで人事が隔週で接触し、承諾後の離脱をゼロにする。次回報告で承諾&#8594;入社の到達率を報告する。</div>
</div>

<div class="st">&#128269; 課題と対策</div>
<div class="issue-grid">

<div class="ic">
<div class="ct">&#9888; 課題1　超過残業者数が2ヶ月ぶりに増加（8.8% &#8594; 10.3%）／ 超過5回目が8名</div>
<div class="cb">6月に56人（8.8%）まで改善した超過残業者数が、7月は65人（10.3%）と反転増加。<strong>超過5回目が8名</strong>まで積み上がっており、9月に違反リーチとなるリスクがある。AP Re:US（職人事業部）は約36%が前月に引き続き超過しており、特定事業部への偏りが2ヶ月連続で解消していない。</div>
</div>
<div class="ac">
<div class="ct">&#10003; 対策1　超過5回目8名への即時介入と、AP Re:USの構造要因の切り分け</div>
<div class="cb">&#8226; 超過5回目8名について、8月中に個別の業務量ヒアリングと配置見直しを実施。管理監督者に該当する者についても、健康確保措置の観点から労働時間の実態を確認する。<br>&#8226; AP Re:USは2ヶ月連続で突出しているため、「一時的な繁忙」ではなく<strong>人員配置・営業時間・調理オペレーションの構造要因</strong>として切り分ける。事業部長・人事責任者による合同ヒアリングを8月中に実施し、改善計画を9月報告会議で提示する。</div>
</div>

<div class="ic">
<div class="ct">&#9888; 課題2　正社員採用の辞退が5名 &#8594; 9名に増加</div>
<div class="cb">8/14時点で内定30名（前月+3名）と母数は増えているが、<strong>辞退が5名から9名へほぼ倍増</strong>。承諾は10名から8名に減少しており、内定を出しても入社に至らない歩留まりの悪化が見られる。7月の入社は11名・退社11名でネット±0名にとどまっており、採用数の積み増しが必要な局面。</div>
</div>
<div class="ac">
<div class="ct">&#10003; 対策2　辞退理由の即時ヒアリングと内定者フォローの前倒し</div>
<div class="cb">辞退9名全員に対して辞退理由を確認し、「条件（給与・勤務地）」「他社競合」「入社までの期間」のいずれが主因かを類型化する。あわせて、内定通知から入社までの期間が長い候補者には現場見学・メンター紹介を前倒しで実施し、承諾後の離脱を防ぐ。次回報告で辞退理由の内訳と改善状況を報告する。</div>
</div>

<div class="ic">
<div class="ct">&#9888; 課題3　PA離職は改善したが、年間54.3%は依然として前期を上回る水準</div>
<div class="cb">7月の離職68名（前月108名）で年間着地予測は58.8%&#8594;54.3%と改善。ただし<strong>前期（FY26）実績54.6%とほぼ同水準</strong>であり、「改善した」というより「悪化が止まった」段階。8月は繁忙期でシフト負荷が上がるため、離職が再増加するリスクがある。</div>
</div>
<div class="ac">
<div class="ct">&#10003; 対策3　繁忙期の離職再増加を防ぐ先回りフォロー</div>
<div class="cb">&#8226; 8月の繁忙期に向けて、在籍3ヶ月未満のPAを対象に入社30日・60日フォロー面談を確実に実施する。<br>&#8226; 離職が集中している組織を特定し、シフト負荷の平準化を店長・エリアマネージャーと調整する。<br>&#8226; 単月の離職率だけでなく<strong>「入社&#8722;退社のネット増減」</strong>を並行して追う。7月はネット+56名と大きくプラスであり、この水準を8月も維持できるかを次回報告の判断軸とする。</div>
</div>

<div class="ic">
<div class="ct">&#9888; 課題4　PA採用費が全月で予算超過 ― 7月239.0%、累計162.7%</div>
<div class="cb">
PA採用費の予算が4&#12316;7月の全月で設定され、初めて予実比較ができるようになった結果、<strong>4月138.3%・5月131.9%・6月215.2%・7月239.0%と全月で予算を超過</strong>していることが判明。累計では予算&#165;14,088千に対し実績&#165;22,916千（<strong>162.7%</strong>）。<br><br>
一方でPA採用単価は&#165;38,209&#8594;&#165;33,333&#8594;&#165;26,687と3ヶ月連続で改善しており、<strong>「1名あたりのコストは下がっているが、採用人数（7月150名）が多いため総額が予算を超える」構造</strong>。PA離職の改善（課題3）と在籍+56名は、この採用投下の結果でもある。中途採用費が累計94.3%と予算内であることを踏まえると、採用費全体の超過はPA側が主因。
</div>
</div>
<div class="ac">
<div class="ct">&#10003; 対策4　予算の前提を確認し、「必要な超過」か「抑えるべき超過」かを切り分ける</div>
<div class="cb">
&#8226; <strong>PA採用費予算の前提となる採用人数を確認する。</strong>予算&#165;14,088千 ÷ 実績単価&#165;30,000前後 = 約470名分に対し、4&#12316;7月の実績入社は約780名。<strong>予算が想定する採用人数と、現場が必要としている人数が合っていない可能性が高い。</strong>まずここを確認する。<br>
&#8226; <strong>離職率との合わせ技で評価する。</strong>PA離職の年間着地予測が58.8%&#8594;54.3%に改善しているのは採用が追いついているためでもある。採用費だけを削ると欠員が発生し、現場負荷&#8594;離職増という悪循環になりかねない。<strong>「採用費を抑える」ではなく「離職を減らして必要採用数そのものを減らす」を主軸に置く。</strong><br>
&#8226; 上記を整理したうえで、予算の期中補正を申請するか、下期の採用計画を絞るかを次回報告で提案する。

function loadMonth(ym) {
  const d = REPORT_DATA[ym];
  if (!d) return;
  document.getElementById('tab-yojitsu').innerHTML = d.yojitsu;
  document.getElementById('tab-soshiki').innerHTML = d.soshiki;
  document.querySelector('header h1').innerHTML = '&#128202; 月例報告会議 ― ' + d.label;
  document.querySelector('header .sub').innerHTML = 'AP Holdings / HR本部 &#124; ' + d.reportDate;
  document.title = '月例報告会議 ' + d.label;
  const frame = document.getElementById('pancake-frame');
  if (frame && frame.contentWindow) {
    frame.contentWindow.postMessage({type:'pancake-set-month', ym: ym}, '*');
  }
  const activeBtn = document.querySelector('.tab-btn.active');
  if (activeBtn) {
    const m = activeBtn.getAttribute('onclick').match(/'(\w+)'/);
    if (m) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('tab-' + m[1]).classList.add('active');
    }
  } else {
    document.getElementById('tab-fujisan').classList.add('active');
  }
}

function switchTab(id, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
  window.scrollTo(0, 0);
}

window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'pancake-resize') {
    const f = document.getElementById('pancake-frame');
    if (f) f.style.height = (e.data.height + 20) + 'px';
  }
});

(function() {
  const months = Object.keys(REPORT_DATA).sort().reverse();
  const sel = document.getElementById('month-select');
  months.forEach(ym => {
    const opt = document.createElement('option');
    opt.value = ym;
    opt.textContent = REPORT_DATA[ym].label;
    sel.appendChild(opt);
  });
  sel.value = months[0];
  loadMonth(months[0]);
})();
</script>
